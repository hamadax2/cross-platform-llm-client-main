name: Flutter Android APK CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Environment needed for Android Gradle builds
      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up the Flutter framework environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Step 4: Configure Android SDK Path for Flutter CLI
      - name: Configure Android SDK Path
        run: |
          flutter config --android-sdk $ANDROID_HOME

      # Step 5: Accept Android Licenses through Flutter CLI directly
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      # Step 6: Download dependencies defined in pubspec.yaml
      - name: Install dependencies
        run: flutter pub get

      # Step 7: Configure Keystore and Properties to bypass Kotlin DSL Gradle check
      - name: Configure Keystore and Properties
        run: |
          # فك تشفير ملف الـ Keystore وحفظه داخل مجلد android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          
          # إنشاء ملف key.properties في جذر مجلد android ليتوافق مع rootProject.file("key.properties")
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          
          # إرسال مسار الـ Keystore النسبي ليفهمه ملف الـ build.gradle.kts الخاص بك
          echo "storeFile=app/release.keystore" >> android/key.properties

      # Step 8: Compile release APK with explicit NDK Injection (حل مشكلة الـ CMake القاطع)
      # نقوم بتمرير مسار الـ NDK الافتراضي للسيرفر مباشرة ليتعرف عليه الـ CMake الخاص بالإضافة المحلية
      - name: Build APK
        run: |
          flutter build apk --release --android-sdk=$ANDROID_HOME
        env:
          ANDROID_NDK_HOME: ${{ civil_plugins == '' && format('{0}/ndk/25.1.8937393', env.ANDROID_HOME) || '' }}
          # ملاحظة: خوادم GitHub تحتوي افتراضياً على الإصدار 25.1.8937393 للـ NDK، وتمريره كـ Environment Variable يحل مشكلة الـ CMake فوراً.

      # Step 9: Upload the compiled binaries to GitHub Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
