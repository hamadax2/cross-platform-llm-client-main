name: Flutter Android APK CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository, including the native plugin submodule.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Step 2: Set up Java Environment needed for Android Gradle builds
      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up the Flutter framework environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Step 4: Configure Android SDK Path for Flutter CLI
      - name: Configure Android SDK Path
        run: |
          flutter config --android-sdk $ANDROID_HOME

      # Step 5: Accept Android SDK licenses non-interactively.
      - name: Accept Android Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      # Step 6: Install BOTH NDK versions required by the native plugins.
      # نقوم بتنزيل الإصدارين 28 و 27 داخل مسار النظام الأساسي ليتسنى لكل إضافة قراءة حزمتها المتوافقة
      - name: Install Required NDK Versions
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "ndk;27.0.12077973"

      # Step 7: Download dependencies defined in pubspec.yaml
      - name: Install dependencies
        run: flutter pub get

      # Step 8: Configure signing only when all release secrets are available.
      - name: Configure release signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_ALIAS != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          {
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storeFile=app/release.keystore"
          } > android/key.properties

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # Step 9: Build a release APK. Unsigned CI builds use the Gradle debug key.
      - name: Build APK
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
          PRIVATELM_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: flutter build apk --release

      # Step 10: Upload the compiled binaries to GitHub Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
