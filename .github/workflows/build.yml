name: Flutter Android APK CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Environment needed for Android Gradle builds
      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up the Flutter framework environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Step 4: Configure Android SDK Path for Flutter CLI
      - name: Configure Android SDK Path
        run: |
          flutter config --android-sdk $ANDROID_HOME

      # Step 5: Accept Android Licenses through Flutter CLI directly
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      # Step 6: Download dependencies defined in pubspec.yaml
      - name: Install dependencies
        run: flutter pub get

      # Step 7: Configure Keystore and Android Environment Properties
      # قمنا بدمج إعدادات الـ Keystore مع حقن مسارات الأندرويد والـ NDK لحل مشكلة الـ CMake نهائياً
      - name: Configure Keystore and Environment Properties
        run: |
          # 1. فك تشفير ملف الـ Keystore وحفظه داخل مجلد android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          
          # 2. إنشاء ملف key.properties في جذر مجلد android ليتوافق مع كود Gradle الخاص بك
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=app/release.keystore" >> android/key.properties
          
          # 3. إنشاء ملف local.properties وضخ مسار الـ SDK والـ NDK بشكل صريح لإجبار الـ CMake على العمل بنجاح
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> android/local.properties

      # Step 8: Compile release APK (الآن سيعمل بنجاح تام لأن الـ CMake مجبر على قراءة المسارات المحقونة)
      - name: Build APK
        run: flutter build apk --release

      # Step 9: Upload the compiled binaries to GitHub Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
