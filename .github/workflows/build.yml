name: Flutter Android APK CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Environment needed for Android Gradle builds
      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up the Flutter framework environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Step 4: Configure Android SDK Path for Flutter CLI
      - name: Configure Android SDK Path
        run: |
          flutter config --android-sdk $ANDROID_HOME

      # Step 5: Accept Android Licenses through Flutter CLI directly
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      # Step 6: Force Install the exact NDK version into the system's SDK path
      # هنا نقوم بإجبار خادم GitHub على تنزيل الإصدار المتوافق داخل المجلد الافتراضي مباشرة وتحديثه
      - name: Force Install Exact NDK Version
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"

      # Step 7: Download dependencies defined in pubspec.yaml
      - name: Install dependencies
        run: flutter pub get

      # Step 8: Configure Keystore and Force Clear Old Local Properties
      - name: Configure Keystore and Environment Properties
        run: |
          # فك تشفير ملف الـ Keystore وحفظه داخل مجلد android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          
          # إنشاء ملف key.properties ليتوافق مع كود Gradle الخاص بك
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=app/release.keystore" >> android/key.properties
          
          # مسح ملف الخصائص تماماً وإعادة بنائه بالمسار الافتراضي للنظام لمنع تشتت الـ Gradle
          rm -f android/local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/28.2.13676358" >> android/local.properties

      # Step 9: Compile release APK (الآن سيتطابق الإصدار مع النظام تماماً وينجح البناء)
      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # Step 10: Upload the compiled binaries to GitHub Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
