name: Flutter Android APK CI

on:
  push:
    branches: [ "main", "master", "v0/workflow-automation-c0b93237" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository, including the native plugin submodule.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Step 2: Set up Java Environment needed for Android Gradle builds
      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up the Flutter framework environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Step 4: Install Android SDK packages required by Flutter and native plugins.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK Path
        run: flutter config --android-sdk "$ANDROID_HOME"

      # Step 5: Accept Android SDK licenses non-interactively.
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      # Step 6: Install required Android SDK and NDK versions.
      # نقوم بتنزيل الإصدارين 28 و 27 داخل مسار النظام الأساسي ليتسنى لكل إضافة قراءة حزمتها المتوافقة
      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "ndk;27.0.12077973"

      # Step 7: Fetch native sources explicitly. The repository stores the
      # plugin wrapper, while the C++ dependency is declared in .gitmodules.
      - name: Fetch native source dependencies
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          if [ ! -f local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp/CMakeLists.txt ]; then
            rm -rf local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp
            git clone --recurse-submodules --shallow-submodules \
              https://github.com/leejet/stable-diffusion.cpp.git \
              local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp
            git -C local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp checkout --detach 28ef93c0e172a29b0dcbd131ec8e34ecbd2b98e2
            git -C local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp submodule update --init --recursive
          fi
          test -f local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp/CMakeLists.txt
          test -f local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp/ggml/CMakeLists.txt

      # Step 8: Download dependencies defined in pubspec.yaml
      - name: Install dependencies
        run: flutter pub get

      # Step 8: Configure signing when release secrets are available.
      # The shell guard is intentional: GitHub Actions does not allow the
      # secrets context directly in a step-level if expression.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=release.keystore"
            } > android/key.properties
            if ! keytool -list -keystore android/app/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "Configured keystore does not contain KEY_ALIAS; falling back to debug signing."
              rm -f android/key.properties android/app/release.keystore
            fi
          else
            echo "Release signing secrets are not configured; using CI debug signing."
          fi

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # Step 9: Build a release APK. Unsigned CI builds use the Gradle debug key.
      - name: Build APK
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
          PRIVATELM_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK output
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk

      # Step 10: Upload the compiled binaries to GitHub Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
